<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Analytics - Login</title>

    <!-- Bootstrap styles for login page -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* Centering login form on page */
        body {
            background-color: #f4f6f9;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        /* Login card styling */
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <!-- Login card -->
    <div class="login-card">
        <h3 class="text-center mb-4">University Analytics</h3>

        <!-- Error message shown for failed login -->
        <div id="error-message" class="alert alert-danger d-none" role="alert"></div>
        
        <!-- Login form -->
        <form id="loginForm">
            <div class="mb-3">
                <label for="email" class="form-label">University Email</label>
                <input type="email" class="form-control" id="email" required placeholder="admin@eastminster.ac.uk">
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" required>
            </div>

            <!-- Login button -->
            <button type="submit" class="btn btn-primary w-100">Access Dashboard</button>
        </form>
    </div>

    <!-- Login logic -->
    <script src="js/auth.js"></script>
</body>
</html>
